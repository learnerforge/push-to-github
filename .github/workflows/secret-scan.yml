name: "Secret Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run gitleaks
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          zricethezav/gitleaks:v8.24.2 \
          git --redact --verbose
